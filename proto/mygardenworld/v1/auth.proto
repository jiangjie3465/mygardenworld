syntax = "proto3";

package mygardenworld.v1;

option java_multiple_files = true;
option java_package = "com.mygardenworld.v1";

import "google/protobuf/timestamp.proto";

// User is a platform user (not a game account).
enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_USER = 1;
  USER_ROLE_ADMIN = 2;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_DISABLED = 2;
}

message User {
  int64 id = 1;
  string username = 2;
  string email = 3;
  UserRole role = 4;
  int32 max_accounts = 5;
  int32 current_accounts = 6;
  UserStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Mobile authentication returns refresh tokens in the response body rather
  // than using browser cookies. Refresh tokens are device-scoped and rotated
  // on every refresh.
  rpc MobileLogin(MobileLoginRequest) returns (MobileLoginResponse);
  rpc MobileRefresh(MobileRefreshRequest) returns (MobileRefreshResponse);
  rpc MobileLogout(MobileLogoutRequest) returns (MobileLogoutResponse);
  // Device sessions are the caller's own mobile refresh-token sessions. Both
  // RPCs require a Bearer access token.
  rpc ListMobileSessions(ListMobileSessionsRequest) returns (ListMobileSessionsResponse);
  rpc RevokeMobileSession(RevokeMobileSessionRequest) returns (RevokeMobileSessionResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  User user = 2;
}

message RefreshRequest {}

message RefreshResponse {
  string access_token = 1;
  User user = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message MobileLoginRequest {
  string username = 1;
  string password = 2;
  string device_id = 3;
  string device_name = 4;
}

message MobileLoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp access_expires_at = 3;
  google.protobuf.Timestamp refresh_expires_at = 4;
  User user = 5;
}

message MobileRefreshRequest {
  string refresh_token = 1;
}

message MobileRefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp access_expires_at = 3;
  google.protobuf.Timestamp refresh_expires_at = 4;
  User user = 5;
}

message MobileLogoutRequest {
  string refresh_token = 1;
}

message MobileLogoutResponse {}

// MobileSession describes one mobile refresh-token session. The token itself
// is never returned.
message MobileSession {
  int64 id = 1;
  string device_id = 2;
  string device_name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_used_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  // current is true when device_id matches the requesting device.
  bool current = 7;
}

message ListMobileSessionsRequest {
  // device_id of the caller, used only to mark the current session.
  string device_id = 1;
}

message ListMobileSessionsResponse {
  repeated MobileSession sessions = 1;
}

message RevokeMobileSessionRequest {
  int64 session_id = 1;
}

message RevokeMobileSessionResponse {}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
}
